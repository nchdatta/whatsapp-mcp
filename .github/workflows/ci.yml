name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: test
        run: go test -race ./...

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [windows/amd64, darwin/arm64, darwin/amd64, linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build ${{ matrix.target }}
        env:
          CGO_ENABLED: "0"
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          export GOOS=${MATRIX_TARGET%/*} GOARCH=${MATRIX_TARGET#*/}
          go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/whatsapp-mcp
