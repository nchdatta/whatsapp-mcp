name: Release

# Push a tag like v1.2.3 to build every platform and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - windows/amd64
          - windows/arm64
          - darwin/amd64
          - darwin/arm64
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/}
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION#v}" \
            -o "dist/whatsapp-mcp-$GOOS-$GOARCH$ext" ./cmd/whatsapp-mcp
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ strategy.job-index }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum whatsapp-mcp-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes --notes "$(cat <<'EOF'
          ## Install

          **Windows** (PowerShell):
          ```powershell
          irm https://raw.githubusercontent.com/nchdatta/whatsapp-mcp/main/scripts/install.ps1 | iex
          ```
          Or download `whatsapp-mcp-windows-amd64.exe` below and double-click it.

          **macOS / Linux**:
          ```sh
          curl -fsSL https://raw.githubusercontent.com/nchdatta/whatsapp-mcp/main/scripts/install.sh | sh
          ```

          The installer offers to link your WhatsApp (QR code or pairing code). Then restart Claude Desktop.
          EOF
          )"
